<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueryGuard: text-to-SQL behind a read-only database role, with every check shown." />
    <title>QueryGuard</title>
    <script>
      // Apply a remembered dark choice before first paint, so it never flashes light (src/hooks/useTheme.ts).
      try { if (localStorage.getItem("queryguard-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
