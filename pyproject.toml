[project]
name = "queryguard"
version = "0.1.0"
description = "Text-to-SQL with a hard read-only database boundary"
requires-python = "==3.12.*"
dependencies = [
    "sqlalchemy",
    "psycopg[binary]",
    "anthropic",
    "fastapi",
    "uvicorn",
    "sqlparse",
    "pandas",
    "python-dotenv",
    "pydantic",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queryguard"]

[tool.uv]
# Installed into the venv (editable) so `python -m queryguard...` resolves.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
